name: Law-Rag Stage 19.4 Artifact Retention V2

on:
  push:
    branches:
      - ops/stage19-4-artifact-retention-v2
  pull_request:
    branches:
      - stage19-4-final-docs-package
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  retain-exact-candidate:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Assert source artifact metadata
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $ExpectedRun = '32629468653'
          $ExpectedArtifactId = '9490770536'
          $ExpectedDigest = 'sha256:3baa68daf4ed2bdd7e644b19965c45a2234f39e84fadb0fbaf2d92a9de53b728'
          $ExpectedSourceSha = '8c05ddd91712d5d9cdbdafe90e77cc9de03b8593'
          $Name = 'law-rag-stage19-4-rc3-engineering-candidate'
          $Headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
          }
          $Uri = "https://api.github.com/repos/${{ github.repository }}/actions/runs/$ExpectedRun/artifacts?name=$Name"
          $Response = Invoke-RestMethod -Uri $Uri -Headers $Headers -Method Get
          $Artifacts = @($Response.artifacts)
          if ($Artifacts.Count -ne 1) { throw "Expected exactly one source artifact, found $($Artifacts.Count)." }
          $Artifact = $Artifacts[0]
          if ([string]$Artifact.id -ne $ExpectedArtifactId) { throw 'Source artifact ID mismatch.' }
          if ([string]$Artifact.name -ne $Name) { throw 'Source artifact name mismatch.' }
          if ([string]$Artifact.digest -ne $ExpectedDigest) { throw 'Source artifact digest mismatch.' }
          if ([bool]$Artifact.expired) { throw 'Source artifact has expired.' }
          if ([string]$Artifact.workflow_run.id -ne $ExpectedRun) { throw 'Source artifact workflow run mismatch.' }
          if ([string]$Artifact.workflow_run.head_sha -ne $ExpectedSourceSha) { throw 'Source artifact head SHA mismatch.' }
          Write-Host "[Law-Rag] Source artifact metadata PASS: id=$ExpectedArtifactId digest=$ExpectedDigest sha=$ExpectedSourceSha"

      - name: Download accepted Stage 19.4 artifact
        uses: actions/download-artifact@v4
        with:
          name: law-rag-stage19-4-rc3-engineering-candidate
          path: retained-candidate
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: '32629468653'

      - name: Verify superseding exact candidate before retention
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ExpectedSourceSha = '8c05ddd91712d5d9cdbdafe90e77cc9de03b8593'
          $ExpectedSourceRun = '32629468653'
          $ExpectedSourceArtifactId = '9490770536'
          $ExpectedSourceArtifactDigest = 'sha256:3baa68daf4ed2bdd7e644b19965c45a2234f39e84fadb0fbaf2d92a9de53b728'

          function Find-One([string]$Name) {
            $matches = @(Get-ChildItem retained-candidate -Recurse -File | Where-Object Name -eq $Name)
            if ($matches.Count -ne 1) {
              throw "Expected exactly one '$Name', found $($matches.Count)."
            }
            return $matches[0]
          }

          function Sha256([string]$Path) {
            return (Get-FileHash -Algorithm SHA256 $Path).Hash.ToLowerInvariant()
          }

          $FinalEvidenceFile = Find-One 'STAGE19-4-FINAL-PACKAGE-EVIDENCE.json'
          $ManifestFile = Find-One 'RC-MANIFEST.json'
          $SumsFile = Find-One 'SHA256SUMS.txt'
          $InstallerEvidenceFile = Find-One 'STAGE19-1-INSTALLER-EVIDENCE.json'
          $SigningEvidenceFile = Find-One 'STAGE19-4-SIGNING-EVIDENCE.json'
          $ZipFile = Find-One 'Law-Rag-0.8.0-rc3-windows-x64.zip'
          $InstallerFile = Find-One 'Law-Rag-0.8.0-rc3-windows-x64-setup.exe'

          $Final = Get-Content $FinalEvidenceFile.FullName -Raw -Encoding UTF8 | ConvertFrom-Json
          $Manifest = Get-Content $ManifestFile.FullName -Raw -Encoding UTF8 | ConvertFrom-Json
          $InstallerEvidence = Get-Content $InstallerEvidenceFile.FullName -Raw -Encoding UTF8 | ConvertFrom-Json
          $Signing = Get-Content $SigningEvidenceFile.FullName -Raw -Encoding UTF8 | ConvertFrom-Json

          if ([string]$Final.source_sha -ne $ExpectedSourceSha) { throw 'Final evidence source SHA mismatch.' }
          if ([string]$Manifest.source_commit_sha -ne $ExpectedSourceSha) { throw 'RC manifest source SHA mismatch.' }
          if ([string]$InstallerEvidence.source_sha -ne $ExpectedSourceSha) { throw 'Installer evidence source SHA mismatch.' }
          if ([string]$Signing.source_sha -ne $ExpectedSourceSha) { throw 'Signing evidence source SHA mismatch.' }
          if ([string]$Final.release_label -ne '0.8.0-rc3') { throw 'Final evidence release label mismatch.' }
          if ([string]$Final.engineering_state -ne 'READY_FOR_FINAL_ACCEPTANCE') { throw 'Engineering state mismatch.' }
          if ([string]$Final.publication_state -ne 'FINAL_ACCEPTANCE_PENDING') { throw 'Publication state mismatch.' }
          if ([bool]$Final.production_signing_executed) { throw 'Candidate unexpectedly claims production signing.' }
          if ([bool]$Final.public_release_published) { throw 'Candidate unexpectedly claims publication.' }
          if ([bool]$Final.provider_network_uat_executed) { throw 'Candidate unexpectedly claims provider-network UAT.' }
          if ([bool]$Final.private_expert_evidence_executed) { throw 'Candidate unexpectedly claims private expert evidence.' }
          if ([bool]$Signing.publication_allowed) { throw 'Stage 19.4 signing gate unexpectedly allows publication.' }

          $ZipSha = Sha256 $ZipFile.FullName
          $InstallerSha = Sha256 $InstallerFile.FullName
          if ($ZipSha -ne ([string]$Final.portable.sha256).ToLowerInvariant()) { throw 'Portable ZIP hash mismatch against final evidence.' }
          if ($ZipSha -ne ([string]$Manifest.artifact.sha256).ToLowerInvariant()) { throw 'Portable ZIP hash mismatch against RC manifest.' }
          if ($InstallerSha -ne ([string]$Final.installer.sha256).ToLowerInvariant()) { throw 'Installer hash mismatch against final evidence.' }
          if ($InstallerSha -ne ([string]$InstallerEvidence.installer.sha256).ToLowerInvariant()) { throw 'Installer hash mismatch against installer evidence.' }
          if ((Get-Item $ZipFile.FullName).Length -ne [int64]$Final.portable.size_bytes) { throw 'Portable ZIP size mismatch.' }
          if ((Get-Item $InstallerFile.FullName).Length -ne [int64]$Final.installer.size_bytes) { throw 'Installer size mismatch.' }

          $SumsText = Get-Content $SumsFile.FullName -Raw -Encoding UTF8
          if ($SumsText -notmatch [regex]::Escape("$ZipSha  Law-Rag-0.8.0-rc3-windows-x64.zip")) {
            throw 'SHA256SUMS.txt does not bind the exact portable ZIP.'
          }

          $SourceFiles = @(
            $ZipFile,
            $ManifestFile,
            $SumsFile,
            $InstallerFile,
            $InstallerEvidenceFile,
            $SigningEvidenceFile,
            $FinalEvidenceFile
          )
          $Inventory = @($SourceFiles | ForEach-Object {
            [ordered]@{
              filename = $_.Name
              sha256 = Sha256 $_.FullName
              size_bytes = $_.Length
            }
          })

          $Preservation = [ordered]@{
            schema_version = '1.0.0'
            purpose = 'STAGE19_4_SUPERSEDING_EXACT_CANDIDATE_RETENTION'
            source_sha = $ExpectedSourceSha
            source_workflow_run_id = $ExpectedSourceRun
            source_artifact_id = $ExpectedSourceArtifactId
            source_artifact_digest = $ExpectedSourceArtifactDigest
            release_label = '0.8.0-rc3'
            engineering_state = 'READY_FOR_FINAL_ACCEPTANCE'
            publication_state = 'FINAL_ACCEPTANCE_PENDING'
            supersedes_source_sha = '933d637b42c0ad038cefc64970a4c9d08f230fcd'
            archival_copy_only = $true
            publication_authorized = $false
            files = $Inventory
          }
          $Preservation | ConvertTo-Json -Depth 8 | Set-Content retained-candidate/STAGE19-4-ARTIFACT-PRESERVATION-V2.json -Encoding UTF8

          Write-Host '[Law-Rag] Superseding exact Stage 19.4 candidate revalidated for archival retention.'
          Write-Host "[Law-Rag] Source artifact digest: $ExpectedSourceArtifactDigest"
          Write-Host "[Law-Rag] Source SHA: $ExpectedSourceSha"
          Write-Host "[Law-Rag] Portable SHA-256: $ZipSha"
          Write-Host "[Law-Rag] Installer SHA-256: $InstallerSha"

      - name: Upload retained superseding exact candidate
        uses: actions/upload-artifact@v4
        with:
          name: law-rag-stage19-4-rc3-exact-candidate-retained-v2
          path: retained-candidate/**
          retention-days: 90
          if-no-files-found: error
