name: Stage 14.5 OCR model assets

on:
  push:
    branches: [stage14-5-offline-ocr-models]
  pull_request:
    branches: [stage14-4-windows-ocr-runtime]

permissions:
  contents: read

jobs:
  windows-ocr-model-assets:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12.10'
      - name: Fetch and strictly verify locked Paddle OCR inference archives
        working-directory: backend
        env:
          PYTHONPATH: .
        shell: pwsh
        run: |
          python -m app.ocr_model_assets `
            --manifest ../release/ocr-models-manifest.json `
            --output-dir ../release/.ocr-model-verify
          Get-Content ../release/.ocr-model-verify/ocr-models-resolved.json
      - name: Ensure verified model payload remains untracked
        shell: pwsh
        run: |
          $tracked = git ls-files release/.ocr-model-verify
          if ($tracked) { throw "OCR model verification payload must never be tracked" }
          $status = git status --short
          if ($status) { Write-Host $status }
      - name: Remove transient verified model payload
        if: always()
        shell: pwsh
        run: Remove-Item release/.ocr-model-verify -Recurse -Force -ErrorAction SilentlyContinue
