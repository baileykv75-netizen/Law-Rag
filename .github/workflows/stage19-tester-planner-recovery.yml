name: Law-Rag Stage 19 Tester Planner Recovery

on:
  pull_request:
    branches:
      - stage19-unsigned-tester-distribution
  workflow_dispatch:

permissions:
  contents: read

jobs:
  planner-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out exact tester-license head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Set up CPython 3.12.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'

      - name: Run planner truncation recovery tests
        shell: bash
        run: |
          python -m pip install --upgrade pip==26.2.1
          python -m pip install -r backend/requirements.txt
          cd backend
          python -m pytest tests/test_audit_planner_provider_recovery.py -q
