name: Law-Rag CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install backend dependencies
        working-directory: backend
        run: python -m pip install -r requirements.txt
      - name: Run backend tests
        working-directory: backend
        env:
          PYTHONPATH: .
        run: pytest -q
      - name: Run public deterministic quality gates
        working-directory: backend
        env:
          PYTHONPATH: .
        run: python -m app.quality_cli --repo-root .. --profile ../benchmarks/public/stage11b_quality_gates.json

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install locked frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Build frontend
        working-directory: frontend
        run: npm run build

  windows-release-bundle-smoke:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, 'verify Windows bundle')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '22.23.2'
          package-manager-cache: false
      - name: Build Windows onedir bundle
        shell: pwsh
        run: ./release/build-windows.ps1
      - name: Show resolved Python release environment
        shell: pwsh
        run: Get-Content release/.build/python-resolved.txt
      - name: Smoke packaged launcher, API, and frontend
        shell: pwsh
        run: ./release/smoke-windows.ps1
      - name: Upload inspectable Windows bundle
        uses: actions/upload-artifact@v4
        with:
          name: law-rag-windows-onedir-stage11d
          path: release/dist/Law-Rag
          if-no-files-found: error
          retention-days: 3

  windows-ocr-dependency-smoke:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, 'verify OCR deps')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install PaddlePaddle CPU
        run: python -m pip install paddlepaddle==3.3.0 -i https://www.paddlepaddle.org.cn/packages/stable/cpu/
      - name: Install PaddleOCR
        run: python -m pip install -r backend/requirements-ocr.txt
      - name: Verify local OCR runtime imports
        run: python -c "import paddle, paddleocr; paddle.utils.run_check(); print('Paddle', paddle.__version__); print('PaddleOCR', paddleocr.__version__)"

  windows-rag-semantic-smoke:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, 'verify RAG semantic')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install base backend dependencies
        working-directory: backend
        run: python -m pip install -r requirements.txt
      - name: Install semantic retrieval dependencies
        working-directory: backend
        run: python -m pip install -r requirements-rag.txt
      - name: Run real local BGE semantic smoke
        working-directory: backend
        env:
          PYTHONPATH: .
          LAW_RAG_RAG_SEMANTIC_SMOKE: '1'
        run: python -m pytest -q -m rag_semantic_smoke
