name: Law-Rag CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install backend dependencies
        working-directory: backend
        run: python -m pip install -r requirements.txt
      - name: Run backend tests
        working-directory: backend
        env:
          PYTHONPATH: .
        run: pytest -q
      - name: Run public deterministic quality gates
        working-directory: backend
        env:
          PYTHONPATH: .
        run: python -m app.quality_cli --repo-root .. --profile ../benchmarks/public/stage11b_quality_gates.json

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install frontend dependencies and resolve lockfile
        working-directory: frontend
        run: npm install
      - name: Commit resolved frontend lockfile once
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          if git diff --quiet -- frontend/package-lock.json && git diff --cached --quiet -- frontend/package-lock.json && git ls-files --error-unmatch frontend/package-lock.json >/dev/null 2>&1; then
            echo "frontend/package-lock.json is already tracked; no bootstrap commit needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package-lock.json
          if git diff --cached --quiet; then
            echo "No lockfile change to commit."
            exit 0
          fi
          git commit -m "stage11d lock frontend dependencies [skip ci]"
          git push origin HEAD:main
      - name: Build frontend
        working-directory: frontend
        run: npm run build

  windows-ocr-dependency-smoke:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, 'verify OCR deps')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install PaddlePaddle CPU
        run: python -m pip install paddlepaddle==3.3.0 -i https://www.paddlepaddle.org.cn/packages/stable/cpu/
      - name: Install PaddleOCR
        run: python -m pip install -r backend/requirements-ocr.txt
      - name: Verify local OCR runtime imports
        run: python -c "import paddle, paddleocr; paddle.utils.run_check(); print('Paddle', paddle.__version__); print('PaddleOCR', paddleocr.__version__)"

  windows-rag-semantic-smoke:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, 'verify RAG semantic')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install base backend dependencies
        working-directory: backend
        run: python -m pip install -r requirements.txt
      - name: Install semantic retrieval dependencies
        working-directory: backend
        run: python -m pip install -r requirements-rag.txt
      - name: Run real local BGE semantic smoke
        working-directory: backend
        env:
          PYTHONPATH: .
          LAW_RAG_RAG_SEMANTIC_SMOKE: '1'
        run: python -m pytest -q -m rag_semantic_smoke
