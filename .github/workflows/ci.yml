name: Law-Rag CI

on:
  push:
    branches: [main, 'stage14-*']
  pull_request:
    branches: [main, 'stage14-*']

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install backend dependencies
        working-directory: backend
        run: python -m pip install -r requirements.txt
      - name: Run backend tests
        working-directory: backend
        env:
          PYTHONPATH: .
        run: pytest -q
      - name: Run public deterministic quality gates
        working-directory: backend
        env:
          PYTHONPATH: .
        run: python -m app.quality_cli --repo-root .. --profile ../benchmarks/public/stage11b_quality_gates.json

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install locked frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Build frontend
        working-directory: frontend
        run: npm run build

  windows-release-bundle-smoke:
    if: (github.event_name == 'pull_request' && startsWith(github.head_ref, 'stage14-4-')) || (github.event_name == 'push' && (contains(github.event.head_commit.message, 'verify Windows bundle') || contains(github.event.head_commit.message, 'verify Windows RC')))
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12.10'
      - uses: actions/setup-node@v6
        with:
          node-version: '22.23.2'
          package-manager-cache: false
      - name: Smoke Windows Credential Manager provider secret storage
        working-directory: backend
        shell: pwsh
        env:
          PYTHONPATH: .
        run: |
          @'
          from app.secret_store import delete_secure_secret, read_secure_secret, resolve_provider_secret, write_secure_secret
          secret = "law-rag-stage12d-synthetic-secret"
          for provider in ("deepseek", "kimi"):
              delete_secure_secret(provider)
          try:
              write_secure_secret("deepseek", secret)
              assert read_secure_secret("deepseek") == secret
              resolved = resolve_provider_secret("deepseek")
              assert resolved.value == secret
              assert resolved.source == "windows_credential_manager"
          finally:
              for provider in ("deepseek", "kimi"):
                  delete_secure_secret(provider)
          assert read_secure_secret("deepseek") is None
          print("Windows Credential Manager round-trip: OK")
          '@ | python -
      - name: Build Windows onedir bundle from isolated exact lock
        shell: pwsh
        run: ./release/build-windows.ps1
      - name: Show resolved isolated Python release environment
        shell: pwsh
        run: Get-Content release/.build/python-resolved.txt
      - name: Verify packaged exact dependency pins
        shell: pwsh
        run: |
          $bundle = Join-Path $PWD "release\dist\Law-Rag"
          $exe = Join-Path $bundle "Law-Rag.exe"
          if (-not (Test-Path $exe)) { throw "Law-Rag.exe missing from packaged bundle" }
          $resolved = Get-Content (Join-Path $bundle "python-resolved.txt") -Raw
          foreach ($pin in @("paddlepaddle==3.3.0", "paddleocr==3.7.0", "paddlex==3.7.2", "pypdfium2==5.12.1")) {
            if ($resolved -notmatch [regex]::Escape($pin)) { throw "Missing exact packaged pin: $pin" }
          }
          Write-Host "Packaged exact dependency pins: OK"
      - name: Verify packaged Paddle native files
        shell: pwsh
        run: |
          $bundle = Join-Path $PWD "release\dist\Law-Rag"
          $paddleNative = Get-ChildItem -Path $bundle -Recurse -File -ErrorAction Stop | Where-Object {
            $_.FullName.ToLowerInvariant().Contains("paddle") -and $_.Extension.ToLowerInvariant() -in @(".dll", ".pyd")
          }
          if (-not $paddleNative) { throw "No packaged Paddle native DLL/PYD files found" }
          $paddleNative | Select-Object -First 20 -ExpandProperty FullName
          Write-Host "Packaged Paddle native files: OK"
      - name: Verify packaged PDFium native file
        shell: pwsh
        run: |
          $bundle = Join-Path $PWD "release\dist\Law-Rag"
          $pdfium = Get-ChildItem -Path $bundle -Recurse -File -Filter "pdfium.dll" -ErrorAction Stop
          if (-not $pdfium) { throw "pdfium.dll missing after OCR runtime packaging" }
          $pdfium | Select-Object -ExpandProperty FullName
          Write-Host "Packaged PDFium native file: OK"
      - name: Reject private application data directories in bundle
        shell: pwsh
        run: |
          $bundle = Join-Path $PWD "release\dist\Law-Rag"
          foreach ($name in @("runtime", "uploads", "jobs", "logs", "data_private", "benchmark_private")) {
            $path = Join-Path $bundle $name
            if (Test-Path $path) {
              Write-Host ("FOUND_PRIVATE_APP_DATA=" + $path)
              throw "Private application data directory found at bundle root"
            }
          }
          Write-Host "Private application data root scan: OK"
      - name: Reject OCR cache directories in bundle
        shell: pwsh
        run: |
          $bundle = Join-Path $PWD "release\dist\Law-Rag"
          $found = Get-ChildItem -Path $bundle -Recurse -Directory -ErrorAction Stop | Where-Object {
            $_.Name.ToLowerInvariant() -in @("model_cache", ".paddlex", ".paddleocr")
          }
          if ($found) {
            $found | ForEach-Object { Write-Host ("FOUND_OCR_CACHE=" + $_.FullName) }
            throw "OCR cache directories found in packaged bundle"
          }
          Write-Host "OCR cache directory scan: OK"
      - name: Reject OCR model payload directories in bundle
        shell: pwsh
        run: |
          $bundle = Join-Path $PWD "release\dist\Law-Rag"
          $found = Get-ChildItem -Path $bundle -Recurse -Directory -ErrorAction Stop | Where-Object {
            $_.Name.ToLowerInvariant() -eq "official_models" -or
            $_.Name -like "PP-OCRv6*_det" -or
            $_.Name -like "PP-OCRv6*_rec"
          }
          if ($found) {
            $found | ForEach-Object { Write-Host ("FOUND_OCR_MODEL_DIR=" + $_.FullName) }
            throw "OCR model payload directories found in packaged bundle"
          }
          Write-Host "OCR model directory scan: OK"
      - name: Run frozen base diagnostics
        shell: pwsh
        run: |
          & ./release/dist/Law-Rag/Law-Rag.exe --diagnose --json
          if ($LASTEXITCODE -ne 0) { throw "Frozen base diagnostics failed with exit code $LASTEXITCODE" }
      - name: Run frozen OCR native diagnostic offline
        shell: pwsh
        run: |
          $env:HTTP_PROXY = "http://127.0.0.1:9"
          $env:HTTPS_PROXY = "http://127.0.0.1:9"
          $env:ALL_PROXY = "http://127.0.0.1:9"
          $env:NO_PROXY = "127.0.0.1,localhost"
          & ./release/dist/Law-Rag/Law-Rag.exe --diagnose-ocr-runtime
          if ($LASTEXITCODE -ne 0) { throw "Frozen OCR runtime diagnostic failed with exit code $LASTEXITCODE" }
      - name: Smoke packaged HTTP PDF and privacy workflow
        shell: pwsh
        run: ./release/smoke-windows.ps1
      - name: Build deterministic portable RC ZIP and manifest
        shell: pwsh
        run: ./release/package-rc.ps1
      - name: Extract final RC and smoke Stage 12 user workflow
        shell: pwsh
        run: ./release/smoke-rc-windows.ps1
      - name: Upload inspectable Windows onedir bundle
        uses: actions/upload-artifact@v4
        with:
          name: law-rag-windows-onedir-stage14-4
          path: release/dist/Law-Rag
          if-no-files-found: error
          retention-days: 3
      - name: Upload portable RC files
        uses: actions/upload-artifact@v4
        with:
          name: law-rag-windows-x64-stage14-4
          path: release/rc
          if-no-files-found: error
          retention-days: 7

  windows-ocr-dependency-smoke:
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && contains(github.event.head_commit.message, 'verify OCR deps'))
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12.10'
      - name: Build isolated exact OCR dependency environment
        shell: pwsh
        run: |
          python -m venv .ocr-venv
          $python = Join-Path $PWD ".ocr-venv\Scripts\python.exe"
          & $python -m pip install --disable-pip-version-check --no-deps -r backend/requirements-release-lock-windows.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $python -m pip install --disable-pip-version-check --no-deps paddlepaddle==3.3.0 -i https://www.paddlepaddle.org.cn/packages/stable/cpu/
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $python -m pip install --disable-pip-version-check --no-deps -r backend/requirements-release-ocr-lock-windows.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $python -m pip check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify exact OCR runtime imports without model initialization or network
        shell: pwsh
        run: |
          $python = Join-Path $PWD ".ocr-venv\Scripts\python.exe"
          $env:PYTHONPATH = (Join-Path $PWD "backend")
          $env:HTTP_PROXY = "http://127.0.0.1:9"
          $env:HTTPS_PROXY = "http://127.0.0.1:9"
          $env:ALL_PROXY = "http://127.0.0.1:9"
          $env:NO_PROXY = "127.0.0.1,localhost"
          & $python -c "from app.ocr_runtime import probe_ocr_runtime; p=probe_ocr_runtime(import_modules=True, run_native_check=True); print(p.model_dump()); raise SystemExit(0 if p.ready else 1)"
      - name: Show resolved isolated OCR dependency closure
        shell: pwsh
        run: |
          $python = Join-Path $PWD ".ocr-venv\Scripts\python.exe"
          & $python -m pip freeze --all | Sort-Object

  windows-rag-semantic-smoke:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, 'verify RAG semantic')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install base backend dependencies
        working-directory: backend
        run: python -m pip install -r requirements.txt
      - name: Install semantic retrieval dependencies
        working-directory: backend
        run: python -m pip install -r requirements-rag.txt
      - name: Run real local BGE semantic smoke
        working-directory: backend
        env:
          PYTHONPATH: .
          LAW_RAG_RAG_SEMANTIC_SMOKE: '1'
        run: python -m pytest -q -m rag_semantic_smoke
