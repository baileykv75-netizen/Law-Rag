name: Law-Rag Stage 16 CI

on:
  push:
    branches: ['stage16-*']
  pull_request:
    branches: ['stage15-*', 'stage16-*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install backend dependencies
        working-directory: backend
        run: python -m pip install -r requirements.txt
      - name: Run backend tests
        working-directory: backend
        env:
          PYTHONPATH: .
        run: pytest -q
      - name: Run existing public deterministic quality gates
        working-directory: backend
        env:
          PYTHONPATH: .
        run: python -m app.quality_cli --repo-root .. --profile ../benchmarks/public/stage11b_quality_gates.json
      - name: Run Stage 16.2 three-domain public regression metrics
        working-directory: backend
        env:
          PYTHONPATH: .
        run: python -m app.public_regression_cli --repo-root .. --profile ../benchmarks/public/stage16b_three_domain_regression.json
      - name: Run Stage 16.2 expanded public evaluation suite
        working-directory: backend
        env:
          PYTHONPATH: .
        run: python -m app.evaluation_suite_cli --repo-root .. --suite ../benchmarks/public/stage16b_evaluation_suite.json
      - name: Assemble Stage 16.5 release evidence matrix
        working-directory: backend
        env:
          PYTHONPATH: .
        run: python -m app.release_evidence_cli --repo-root ..

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install locked frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Build frontend
        working-directory: frontend
        run: npm run build
