name: Stage 14.7 final Windows release validation

on:
  push:
    branches: [stage14-7-final-release-validation]

permissions:
  contents: read

jobs:
  windows-final-stage14-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12.10'
      - uses: actions/setup-node@v6
        with:
          node-version: '22.23.2'
          package-manager-cache: false

      - name: Build clean Windows onedir with exact runtime and fixed OCR models
        shell: pwsh
        run: ./release/build-windows.ps1

      - name: Show resolved release runtime and OCR model identities
        shell: pwsh
        run: |
          Get-Content release/.build/python-resolved.txt
          Get-Content release/.build/ocr-models/ocr-models-resolved.json

      - name: Verify frozen OCR model integrity without outbound network
        shell: pwsh
        run: |
          $env:HTTP_PROXY = "http://127.0.0.1:9"
          $env:HTTPS_PROXY = "http://127.0.0.1:9"
          $env:ALL_PROXY = "http://127.0.0.1:9"
          $env:NO_PROXY = "127.0.0.1,localhost"
          & ./release/dist/Law-Rag/Law-Rag.exe --diagnose-ocr-models --json
          if ($LASTEXITCODE -ne 0) { throw "Frozen OCR model integrity diagnostic failed with exit code $LASTEXITCODE" }

      - name: Run packaged base PDF OCR UI and privacy smoke
        shell: pwsh
        run: ./release/smoke-windows.ps1

      - name: Run packaged Stage 14.7 DOCX Pipeline and image OCR API smoke
        shell: pwsh
        run: ./release/smoke-stage14-7-windows.ps1

      - name: Build deterministic portable RC ZIP and manifest
        shell: pwsh
        run: ./release/package-rc.ps1

      - name: Extract final RC and repeat complete user-flow smoke
        shell: pwsh
        run: ./release/smoke-rc-windows.ps1

      - name: Verify model payload is not tracked in Git
        shell: pwsh
        run: |
          $tracked = git ls-files | Select-String -Pattern 'PP-OCRv6_medium_(det|rec).*(inference\.pdiparams|inference\.json|inference\.yml)'
          if ($tracked) { throw "OCR model binaries must not be committed to Git" }

      - name: Upload inspectable Stage 14.7 Windows onedir
        uses: actions/upload-artifact@v4
        with:
          name: law-rag-windows-onedir-stage14-7
          path: release/dist/Law-Rag
          if-no-files-found: error
          retention-days: 3

      - name: Upload Stage 14.7 portable RC
        uses: actions/upload-artifact@v4
        with:
          name: law-rag-windows-x64-stage14-7
          path: release/rc
          if-no-files-found: error
          retention-days: 7
