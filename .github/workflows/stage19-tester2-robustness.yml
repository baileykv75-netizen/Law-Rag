name: Law-Rag Stage 19 Tester2 Robustness

on:
  pull_request:
    branches:
      - stage19-tester-license-gate
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip==26.2.1
          python -m pip install -r backend/requirements.txt
      - name: Run tester2 robustness regression tests
        working-directory: backend
        run: |
          python -m pytest \
            tests/test_audit_planner_provider_recovery.py \
            tests/test_safe_persistence_windows_retry.py \
            tests/test_tester_license.py \
            tests/test_tester_report_watermark.py \
            -q
      - name: Run batch regression tests
        working-directory: backend
        run: |
          python -m pytest tests/test_batch_results.py -q
      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

  windows-persistence-stress:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
      - name: Install backend dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip==26.2.1
          python -m pip install -r backend/requirements.txt
      - name: Reproduce Windows persistence concurrency pressure
        shell: pwsh
        working-directory: backend
        run: |
          python -m pytest tests/test_safe_persistence_windows_retry.py -q
      - name: Run Planner recovery tests on Windows
        shell: pwsh
        working-directory: backend
        run: |
          python -m pytest tests/test_audit_planner_provider_recovery.py -q

  source-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Guard tester2 source boundaries
        run: |
          set -euo pipefail
          if git ls-files '*.pem' '*.key' '*.p12' '*.pfx' | grep -q .; then
            echo 'Private-key-like material must not be tracked.' >&2
            exit 1
          fi
          grep -q 'NETWORK_MAX_ATTEMPTS = 5' backend/app/audit_planner_provider.py
          grep -q 'bounded_fallback' backend/app/audit_planner_provider.py
          grep -q 'read_text_with_retry' backend/app/safe_persistence.py
          grep -q 'invalid_jobs' backend/app/batch_results_models.py
          grep -q 'MAX_TRANSIENT_POLL_FAILURES' frontend/src/BatchResultsApp.tsx
          echo '[Law-Rag] tester2 robustness source contracts: PASS'
