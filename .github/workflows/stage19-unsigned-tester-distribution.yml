name: Law-Rag Stage 19 Unsigned Tester Distribution

on:
  pull_request:
    branches:
      - stage19-final-acceptance-operator-handoff
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  prepare-limited-unsigned-tester-handoff:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Check out exact distribution tooling head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Assert exact PR head checkout
        if: github.event_name == 'pull_request'
        shell: pwsh
        run: |
          $actual = (git rev-parse HEAD).Trim().ToLowerInvariant()
          $expected = '${{ github.event.pull_request.head.sha }}'.ToLowerInvariant()
          if ($actual -ne $expected) { throw "Expected exact PR head $expected, got $actual" }
          Write-Host "[Law-Rag] exact distribution tooling head: $actual"

      - name: Parse tester-distribution PowerShell
        shell: pwsh
        run: |
          $Tokens = $null
          $Errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path './release/prepare-stage19-unsigned-tester-distribution.ps1'),
            [ref]$Tokens,
            [ref]$Errors
          ) | Out-Null
          if (@($Errors).Count -ne 0) {
            throw "Tester-distribution PowerShell parse failure: $(@($Errors | ForEach-Object ToString) -join '; ')"
          }
          Write-Host '[Law-Rag] tester-distribution PowerShell parse PASS'

      - name: Assert required tester scenarios are documented
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $Guide = Get-Content './docs/STAGE19_UNSIGNED_TESTER_DISTRIBUTION.md' -Raw -Encoding UTF8
          $Feedback = Get-Content './docs/STAGE19_TESTER_FEEDBACK_TEMPLATE.md' -Raw -Encoding UTF8

          foreach ($Required in @(
            '## Required test — Offline OCR',
            'Fully disconnect the test PC from the network',
            'no model/runtime download is required',
            '## Required test — Report export',
            'Export **DOCX**',
            'PDF_REPORT_EXPORT'
          )) {
            if (-not $Guide.Contains($Required)) { throw "Tester guide is missing required scenario text: $Required" }
          }

          foreach ($Required in @(
            '## Required — Offline OCR',
            'Internet disconnected before import',
            'Offline OCR overall result: PASS / FAIL',
            '## Required — Report export',
            'DOCX report export overall result',
            'PDF report export overall result'
          )) {
            if (-not $Feedback.Contains($Required)) { throw "Tester feedback template is missing required field: $Required" }
          }

          Write-Host '[Law-Rag] required offline OCR tester scenario PASS'
          Write-Host '[Law-Rag] required report export tester scenario PASS'

      - name: Download exact retained Stage 19.4 candidate
        uses: actions/download-artifact@v4
        with:
          name: law-rag-stage19-4-rc3-exact-candidate-retained-v2
          path: ${{ runner.temp }}/stage19-retained
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: baileykv75-netizen/Law-Rag
          run-id: 32633906191

      - name: Prepare exact unsigned tester distribution
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          ./release/prepare-stage19-unsigned-tester-distribution.ps1 `
            -SourceDir "$env:RUNNER_TEMP\stage19-retained" `
            -OutputDir "$env:RUNNER_TEMP\law-rag-tester-dist"

      - name: Assert limited-tester evidence and frozen hashes
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $Root = "$env:RUNNER_TEMP\law-rag-tester-dist"
          $EvidencePath = Join-Path $Root 'STAGE19-UNSIGNED-TESTER-DISTRIBUTION-EVIDENCE.json'
          $Evidence = Get-Content $EvidencePath -Raw -Encoding UTF8 | ConvertFrom-Json

          if ($Evidence.distribution_state -ne 'READY_FOR_LIMITED_UNSIGNED_TESTING') { throw 'Tester distribution state mismatch.' }
          if ($Evidence.distribution_scope -ne 'INVITED_TESTERS_ONLY') { throw 'Tester distribution scope mismatch.' }
          if ($Evidence.engineering_candidate.source_sha -ne '8c05ddd91712d5d9cdbdafe90e77cc9de03b8593') { throw 'Frozen Stage 19.4 source SHA mismatch.' }
          if ($Evidence.engineering_candidate.retained_artifact_id -ne '9491794952') { throw 'Retained artifact ID mismatch.' }
          if ($Evidence.engineering_candidate.portable.sha256 -ne '9ba6c15cab5aa97820311ee97589ed338d88b9fad81ab6b96d06ff6162b6e796') { throw 'Frozen portable SHA mismatch.' }
          if ($Evidence.engineering_candidate.installer.sha256 -ne 'cc94adf002984c7bfd7d2c0b7c7fc30e4bf19a95add655c448ace8a5deeb1ef8') { throw 'Frozen installer SHA mismatch.' }
          if ($Evidence.engineering_candidate.installer.authenticode_status -ne 'NotSigned') { throw 'Tester installer unexpectedly became signed.' }
          if ($Evidence.tester_handoff.binaries_modified) { throw 'Tester handoff claims binary modification.' }
          if ($Evidence.tester_handoff.application_rebuilt -or $Evidence.tester_handoff.installer_rebuilt) { throw 'Tester handoff rebuilt frozen binaries.' }
          if ($Evidence.tester_handoff.production_signing_executed -or $Evidence.tester_handoff.detached_cms_signing_executed) { throw 'Tester handoff crossed a signing boundary.' }
          if ($Evidence.tester_handoff.public_release_published -or $Evidence.tester_handoff.update_channel_published) { throw 'Tester handoff crossed a publication boundary.' }
          if ($Evidence.production_release.final_acceptance_state -ne 'FINAL_ACCEPTANCE_PENDING') { throw 'Production Final Acceptance state was incorrectly advanced.' }
          if (-not $Evidence.production_release.production_signer_deferred) { throw 'Production signer deferral was not recorded.' }

          $Installer = Join-Path $Root 'installer\Law-Rag-0.8.0-rc3-windows-x64-setup.exe'
          $Portable = Join-Path $Root 'portable\Law-Rag-0.8.0-rc3-windows-x64.zip'
          $InstallerSha = (Get-FileHash -Algorithm SHA256 $Installer).Hash.ToLowerInvariant()
          $PortableSha = (Get-FileHash -Algorithm SHA256 $Portable).Hash.ToLowerInvariant()
          if ($InstallerSha -ne 'cc94adf002984c7bfd7d2c0b7c7fc30e4bf19a95add655c448ace8a5deeb1ef8') { throw 'Installer changed after tester handoff.' }
          if ($PortableSha -ne '9ba6c15cab5aa97820311ee97589ed338d88b9fad81ab6b96d06ff6162b6e796') { throw 'Portable changed after tester handoff.' }

          Write-Host '[Law-Rag] exact unsigned installer identity PASS'
          Write-Host '[Law-Rag] exact unsigned portable identity PASS'
          Write-Host '[Law-Rag] limited tester distribution evidence PASS'

      - name: Prove production boundaries remain untouched
        shell: pwsh
        run: |
          if ($env:DEEPSEEK_API_KEY -or $env:MOONSHOT_API_KEY) { throw 'Unsigned tester distribution must not receive provider keys.' }
          Write-Host '[Law-Rag] application rebuild performed: false'
          Write-Host '[Law-Rag] installer rebuild performed: false'
          Write-Host '[Law-Rag] production signing performed: false'
          Write-Host '[Law-Rag] detached CMS signing performed: false'
          Write-Host '[Law-Rag] provider/network UAT performed: false'
          Write-Host '[Law-Rag] private expert evidence performed: false'
          Write-Host '[Law-Rag] public release publication performed: false'
          Write-Host '[Law-Rag] update-channel publication performed: false'

      - name: Upload installer tester handoff
        uses: actions/upload-artifact@v4
        with:
          name: law-rag-0.8.0-rc3-unsigned-tester-installer
          path: ${{ runner.temp }}/law-rag-tester-dist/installer/**
          retention-days: 30
          compression-level: 0
          if-no-files-found: error

      - name: Upload portable tester handoff
        uses: actions/upload-artifact@v4
        with:
          name: law-rag-0.8.0-rc3-unsigned-tester-portable
          path: ${{ runner.temp }}/law-rag-tester-dist/portable/**
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
